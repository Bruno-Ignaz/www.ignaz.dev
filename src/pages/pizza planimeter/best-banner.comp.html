    <div class="flex items-center gap-4">
      <span class="material-symbols-outlined text-4xl hidden md:block" data-weight="fill">workspace_premium</span>
      <div>
        <h4 class="text-label-sm font-label-sm uppercase tracking-wider mb-1 opacity-90">Best Overall Value</h4>
        <p id="best-pizza-name" class="text-headline-md font-headline-md">{{ pizzaName }}</p>
      </div>
    </div>
    <div class="text-right">
      <div id="best-pizza-value" class="text-display-lg font-display-lg font-data-mono">{{ value }}</div>
      <div class="text-label-sm font-label-sm opacity-90">¢/cm²</div>
    </div>
  </div>
